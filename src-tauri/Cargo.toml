[package]
name = "cezecore"
version = "0.1.0"
description = "CEZECORE — Developer & Network Intelligence"
authors = ["CEZECORE"]
edition = "2021"

[lib]
name = "cezecore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30.13"
